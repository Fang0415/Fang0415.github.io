services:
  postgres:
    image: postgres:16-alpine
    container_name: fang-blog-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fang_blog
      POSTGRES_USER: fang_blog
      POSTGRES_PASSWORD: fang_blog
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fang_blog -d fang_blog"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: fang-blog-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    container_name: fang-blog-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done &&
      mc mb -p local/fang-blog &&
      mc anonymous set download local/fang-blog
      "

volumes:
  postgres-data:
  minio-data:
